<!doctype html>
<html lang="zh-CN">
<head>
<!-- pwa-shell -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="robots" content="noindex,nofollow">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f7e3ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>冲刺背诵手册 · 下册</title>
<style>
:root{
  --bar:rgba(255,249,252,.88);--panel:#fff8fb;--card:#fffdfe;
  --fg:#3a2b31;--fg2:#9b7d88;--line:rgba(186,124,150,.20);
  --accent:#b8486f;--accent-soft:rgba(216,124,152,.14);--accent-line:rgba(184,72,111,.34);
  --ok:#7fae9d;--ok-soft:rgba(127,174,157,.18);
  --shadow:0 10px 30px rgba(158,86,118,.14);--shadow-s:0 4px 14px rgba(158,86,118,.10);
  --barT:64px;--barB:66px;--side:300px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{overflow:hidden;color:var(--fg);
  background:radial-gradient(120% 80% at 50% -10%,#fff7fa 0%,#fbe8f0 46%,#f3d6e3 100%);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;color:inherit}
button:active{transform:scale(.97)}
svg{display:block}
.ib{width:44px;height:44px;flex:none;border:0;border-radius:14px;background:transparent;display:grid;place-items:center;
  color:var(--fg);text-decoration:none;transition:background .16s ease,color .16s ease,transform .12s ease}
.ib:active{background:var(--accent-soft);transform:scale(.93)}
.ib.on{color:var(--accent);background:var(--accent-soft)}
.ib.nav{background:rgba(255,255,255,.55);border:1px solid var(--line)}
.ib.nav:active{background:var(--accent-soft)}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- top bar ---------- */
.topbar{position:fixed;top:calc(env(safe-area-inset-top) + 6px);left:8px;right:8px;z-index:40;height:52px;
  padding:0 8px;display:flex;align-items:center;gap:4px;border-radius:18px;border:1px solid var(--line);
  background:rgba(255,250,252,.87);backdrop-filter:blur(12px) saturate(1.15);-webkit-backdrop-filter:blur(12px) saturate(1.15);
  box-shadow:var(--shadow-s)}
.ttl{flex:1;min-width:0;padding:0 4px;line-height:1.25}
.ttl .t1{font-size:14px;font-weight:650;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl .t2{font-size:10.5px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.today{height:44px;min-width:62px;flex:none;padding:0 10px;border-radius:14px;border:1px solid var(--line);
  background:rgba(255,255,255,.62);display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--fg2);
  transition:background .16s ease,color .16s ease,border-color .16s ease}
.today svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.today b{font-size:14px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.today.hot{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent)}

/* ---------- page stage ---------- */
.viewport{position:fixed;left:0;right:0;top:calc(var(--barT) + env(safe-area-inset-top));
  bottom:calc(var(--barB) + env(safe-area-inset-bottom));
  overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
  touch-action:pan-x}
.viewport::-webkit-scrollbar,.side-body::-webkit-scrollbar,.sheet::-webkit-scrollbar{display:none;width:0;height:0}
.viewport,.side-body,.sheet{scrollbar-width:none;-ms-overflow-style:none}
.track{display:flex;height:100%}
.slide{flex:0 0 100%;height:100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;
  padding:10px 8px;position:relative;overflow:hidden}
.pagebox{position:relative;display:flex;align-items:center;justify-content:center;line-height:0;
  max-width:var(--pw,100%);max-height:var(--ph,100%);background:#fff;border-radius:5px;
  box-shadow:0 6px 18px rgba(140,80,105,.16),0 1px 2px rgba(140,80,105,.10);overflow:hidden;transform-origin:center center}
.pagebox img{display:block;max-width:var(--pw,100%);max-height:var(--ph,100%);width:auto;height:auto;object-fit:contain;
  -webkit-user-drag:none;user-select:none;-webkit-touch-callout:none}
.slide .no{position:absolute;right:12px;bottom:10px;z-index:4;font-size:10.5px;letter-spacing:.02em;color:#9a6377;
  background:rgba(255,255,255,.92);border:1px solid var(--line);padding:2px 8px;border-radius:999px;
  transition:opacity .16s ease}
.slide .cnt{display:none}
body.zoomed .slide .no{opacity:0}
body.zoomed .pagebox{will-change:transform}

/* ---------- blanks ---------- */
body:not(.cloze) .blank{display:none}
.blank{position:absolute;cursor:pointer;z-index:3;border-radius:5px;
  transition:opacity .16s ease,transform .1s ease;
  background:rgba(205,235,224,1);box-shadow:inset 0 0 0 1px rgba(120,175,155,.16)}
.blank:active{transform:scale(.97)}
.blank.open{opacity:0;pointer-events:none}
body.bs-blur .blank{-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  background:linear-gradient(180deg,rgba(255,252,246,.97),rgba(246,236,220,.96));
  box-shadow:inset 0 0 0 1px rgba(190,160,120,.24)}
body.bs-marker .blank{-webkit-backdrop-filter:none;backdrop-filter:none;
  background:rgba(255,212,112,.97);box-shadow:0 1px 0 rgba(200,150,60,.32);border-radius:3px}
body.bs-blank .blank{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(255,255,255,.98);
  border-radius:3px;box-shadow:inset 0 -2px 0 rgba(179,56,91,.42),inset 0 0 0 1px rgba(200,180,160,.32)}
body.bs-candy .blank:nth-child(5n+2){background:rgba(255,231,214,1);box-shadow:inset 0 0 0 1px rgba(215,165,110,.16)}
body.bs-candy .blank:nth-child(5n+3){background:rgba(224,228,255,1);box-shadow:inset 0 0 0 1px rgba(150,160,215,.16)}
body.bs-candy .blank:nth-child(5n+4){background:rgba(255,242,205,1);box-shadow:inset 0 0 0 1px rgba(210,185,110,.16)}
body.bs-candy .blank:nth-child(5n+5){background:rgba(255,226,234,1);box-shadow:inset 0 0 0 1px rgba(215,150,170,.16)}
body.bs-hint .blank{-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  background:rgba(250,246,238,.5);box-shadow:inset 0 0 0 1px rgba(190,160,120,.22)}
body.bs-dark .blank{-webkit-backdrop-filter:none;backdrop-filter:none;background:#221d1f}

/* ---------- bottom hud ---------- */
.hud{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 6px);z-index:40;height:56px;
  padding:0 7px;display:flex;align-items:center;gap:5px;border-radius:20px;border:1px solid var(--line);
  background:rgba(255,250,252,.89);backdrop-filter:blur(12px) saturate(1.15);-webkit-backdrop-filter:blur(12px) saturate(1.15);
  box-shadow:var(--shadow-s)}
.seek{flex:1;min-width:70px;display:flex;flex-direction:column;justify-content:center;padding:0 4px}
.seek input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0}
.seek input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;
  background:linear-gradient(90deg,#f3cbdb 0%,#e7b0c6 55%,#dc9cb6 100%)}
.seek input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:#fff;border:2px solid var(--accent);box-shadow:0 2px 8px rgba(158,86,118,.30),0 0 0 4px rgba(216,124,152,.13);
  margin-top:-8px}
.seek input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:linear-gradient(90deg,#f3cbdb,#dc9cb6)}
.seek input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--accent)}
.idx{font-size:10px;color:var(--fg2);line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap}
.idxrow{display:flex;align-items:center;justify-content:center;gap:5px;line-height:1}
.lv{flex:none;height:16px;padding:0 6px;border-radius:999px;border:1px solid var(--line);
  background:rgba(255,255,255,.6);display:inline-flex;align-items:center;font-size:9.5px;color:var(--fg2);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.lv.d1{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.lv.d2{color:#fff;border-color:transparent;background:linear-gradient(180deg,#c4698e,#a93a63)}
.lcnt{flex:none;height:16px;padding:0 6px;border-radius:999px;border:1px solid var(--accent-line);
  background:rgba(255,247,251,.9);color:var(--accent);font-size:9.5px;display:none;align-items:center;white-space:nowrap}
body.cloze .lcnt{display:inline-flex}
.hud input[type=number]{width:48px;height:44px;flex:none;border-radius:13px;border:1px solid var(--line);
  background:rgba(255,255,255,.7);color:var(--fg);text-align:center;font-size:12px;-webkit-appearance:none;margin:0}
.hud input[type=number]::-webkit-outer-spin-button,.hud input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ib.wide{width:auto;padding:0 11px;font-size:12px;font-weight:600;gap:5px;display:flex;align-items:center;
  border:1px solid var(--line);background:rgba(255,255,255,.66);color:var(--accent)}
.donebtn{flex:none;height:44px;padding:0 16px;border:0;border-radius:16px;color:#fff;font-size:13.5px;font-weight:700;
  display:flex;align-items:center;gap:6px;white-space:nowrap;
  background:linear-gradient(180deg,#cd6a8e 0%,#b8486f 55%,#a93a63 100%);
  box-shadow:0 8px 20px rgba(169,58,99,.28),inset 0 1px 0 rgba(255,255,255,.28);
  transition:transform .12s ease,box-shadow .16s ease}
.donebtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.donebtn:active{transform:scale(.97);box-shadow:0 3px 10px rgba(169,58,99,.22)}
.donebtn.ok{background:linear-gradient(180deg,#93c1b1,#6fa392);box-shadow:0 6px 16px rgba(90,140,120,.3)}

/* ---------- side drawer ---------- */
.side{position:fixed;left:0;top:0;bottom:0;z-index:60;width:min(84vw,336px);display:flex;flex-direction:column;
  background:linear-gradient(180deg,#fffafc,#fff2f7);border-radius:0 22px 22px 0;
  border-right:1px solid var(--line);box-shadow:18px 0 48px rgba(150,80,110,.18);
  transform:translateX(-103%);transition:transform .2s cubic-bezier(.22,.8,.28,1)}
.side.open{transform:none}
.side-head{padding:calc(14px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line)}
.side-head .bt{font-size:13.5px;font-weight:700;padding-right:36px}
.side-head .bs{font-size:10.5px;color:var(--fg2);margin-top:3px}
.side-x{position:absolute;right:8px;top:calc(10px + env(safe-area-inset-top));width:44px;height:44px;border:0;
  border-radius:14px;background:transparent;display:grid;place-items:center;color:var(--fg2);font-size:15px}
.side-tabs{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}
.side-tabs button{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.7);
  color:var(--fg2);font-size:12.5px;font-weight:600;transition:color .16s ease,border-color .16s ease,background .16s ease}
.side-tabs button.on{border-color:var(--accent-line);color:var(--accent);background:var(--accent-soft)}
.side-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 8px 28px}
.grp{margin:4px 0 10px}
.grp-h{cursor:pointer;display:flex;align-items:center;gap:6px;padding:9px 8px;min-height:44px;border-radius:12px;
  font-size:11.5px;font-weight:700;color:var(--accent);letter-spacing:.02em}
.grp-h:active{background:var(--accent-soft)}
.grp-h .car{font-size:9px;color:var(--fg2);transition:transform .18s ease;flex:none}
.grp-h .gt{flex:1;min-width:0}
.grp-h .gp{flex:none;font-size:10px;font-weight:600;color:var(--fg2);background:rgba(255,255,255,.75);
  border:1px solid var(--line);border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
.grp.collapsed .car{transform:rotate(-90deg)}
.grp.collapsed .toc-item{display:none}
.toc-item{display:flex;gap:9px;min-height:46px;padding:8px 10px;border-radius:13px;color:var(--fg);text-decoration:none;
  font-size:12.5px;line-height:1.4;align-items:center;margin:0 2px 1px;transition:background .14s ease}
.toc-item:active{background:rgba(239,124,156,.12)}
.toc-item .tx{flex:1;min-width:0}
.toc-item .pg{color:var(--fg2);font-size:10.5px;flex:none;min-width:34px;text-align:center;font-variant-numeric:tabular-nums;
  background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:999px;padding:1px 6px}
.toc-item.on{background:var(--accent-soft);color:var(--accent);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;box-sizing:border-box}
.dot.d0{background:transparent;box-shadow:inset 0 0 0 1.5px #dcc2cd}
.dot.d1{background:#e39db5}
.dot.d2{background:linear-gradient(135deg,#c4698e,#a93a63);box-shadow:0 0 0 2px rgba(216,124,152,.16)}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.thumbs button{padding:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff;position:relative}
.thumbs img{display:block;width:100%;height:auto}
.thumbs span{position:absolute;right:4px;bottom:3px;font-size:9px;color:#fff;background:rgba(90,50,65,.55);
  padding:0 4px;border-radius:4px;line-height:1.5}
.thumbs .dot{position:absolute;left:5px;top:5px;width:9px;height:9px;box-shadow:0 0 0 1.5px rgba(255,255,255,.9)}
.thumbs button.on{outline:2px solid var(--accent);outline-offset:-2px}
.side-scrim{position:fixed;inset:0;z-index:55;background:rgba(120,80,95,.24);opacity:0;pointer-events:none;transition:opacity .2s ease}
.side-scrim.show{opacity:1;pointer-events:auto}

/* iPad 横屏（>=1000px）：目录默认常驻，书页区域让出 300px；button 可收起 */
@media (min-width:1000px){
  .side{transform:none;width:var(--side);border-radius:0;box-shadow:4px 0 24px rgba(150,80,110,.07)}
  .side-scrim{display:none!important}
  .topbar{left:calc(var(--side) + 8px)}
  .viewport{left:var(--side)}
  .hud{left:calc(var(--side) + 8px)}
  .side-head .bt{font-size:14px}
}
body.side-off .side{transform:translateX(-102%)}
body.side-off .topbar,body.side-off .hud{left:8px}
body.side-off .viewport{left:0}
/* 放大时自动清屏：只留书页，双击复原时工具栏一起回来 */
body.zoommode .topbar,body.zoommode .hud,body.zoommode .side,body.zoommode .side-scrim{display:none!important}
body.zoommode .viewport{top:0!important;bottom:0!important;left:0!important}

/* ---------- sheets ---------- */
.sheet-scrim{position:fixed;inset:0;z-index:75;background:rgba(120,80,95,.24);opacity:0;pointer-events:none;transition:opacity .2s ease}
.sheet-scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:80;max-height:78vh;overflow:auto;
  background:linear-gradient(180deg,#fffbfd 0%,#fff4f8 62%,#fff0f7 100%);border-radius:26px 26px 0 0;
  border:1px solid var(--line);border-bottom:0;
  box-shadow:0 -16px 46px rgba(150,80,110,.20);transform:translateY(102%);
  transition:transform .22s cubic-bezier(.22,.8,.28,1);padding:10px 16px calc(22px + env(safe-area-inset-bottom));
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet.show{transform:none}
.sheet::before{content:'';display:block;width:46px;height:5px;border-radius:3px;background:#f0d3df;margin:-1px auto 10px}
.sh-head{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.sh-head h3{margin:0;flex:1;font-size:16.5px;font-weight:750;letter-spacing:.01em}
.sh-x{width:44px;height:44px;flex:none;border:0;border-radius:14px;background:transparent;color:var(--fg2);font-size:15px}
.sh-sub{margin:0 0 10px;font-size:11.5px;color:var(--fg2);line-height:1.5}
.sh-tip{margin:12px 0 0;font-size:11px;color:var(--fg2);line-height:1.6}
.seg{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.seg button{min-height:44px;padding:0 13px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.76);
  color:var(--fg2);font-size:12px;transition:color .16s ease,border-color .16s ease,background .16s ease}
.seg button.on{border-color:var(--accent-line);color:var(--accent);background:var(--accent-soft);font-weight:600}
.sheet-main{width:100%;height:48px;margin-top:10px;border-radius:16px;border:1px solid var(--accent-line);
  background:var(--accent-soft);color:var(--accent);font-size:13.5px;font-weight:700;
  position:sticky;bottom:0;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.opt{display:flex;width:100%;min-height:52px;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;
  padding:0 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.8);
  font-size:13px;color:var(--fg);text-align:left}
.opt span{font-size:11px;color:var(--fg2);font-weight:400}
.due-row{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid rgba(186,124,150,.13)}
.due-go{flex:1;min-width:0;min-height:50px;display:flex;align-items:center;gap:10px;border:0;background:transparent;
  padding:4px 2px;text-align:left;border-radius:12px}
.pbadge{flex:none;min-width:46px;height:30px;padding:0 8px;border-radius:9px;display:grid;place-items:center;
  font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-line);
  font-variant-numeric:tabular-nums}
.dinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.dinfo b{font-size:12.5px;font-weight:600}
.dinfo i{font-style:normal;font-size:10.5px;color:var(--fg2)}
.due-sn{flex:none;height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);
  background:rgba(255,255,255,.72);color:var(--fg2);font-size:11.5px}
.empty{padding:18px 6px 8px;text-align:center;font-size:13px;line-height:1.8;color:var(--fg)}
.empty span{font-size:11.5px;color:var(--fg2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 0 12px}
.stats div{padding:11px 6px;border-radius:16px;background:rgba(255,255,255,.92);border:1px solid var(--line);
  text-align:center;box-shadow:0 2px 8px rgba(158,86,118,.06)}
.stats b{display:block;font-size:19px;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.25}
.stats span{font-size:10.5px;color:var(--fg2)}
.sh-row{display:flex;gap:8px;margin-bottom:10px}
.ghost{flex:1;height:46px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.76);
  color:var(--fg);font-size:13px;font-weight:600}
.ghost.danger{color:#a8402f;border-color:rgba(168,64,47,.30);background:rgba(255,248,246,.9)}
.ghost.arm{background:rgba(184,72,111,.9);color:#fff;border-color:transparent}
#exportBox{width:100%;height:132px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);
  background:rgba(255,255,255,.78);color:var(--fg2);font-size:10.5px;line-height:1.5;font-family:ui-monospace,Menlo,monospace;
  resize:vertical;-webkit-user-select:text;user-select:text}
#exportBox:focus{outline:2px solid var(--accent-soft);outline-offset:1px}

/* ---------- feedback ---------- */
.burst{position:fixed;z-index:85;width:78px;height:78px;margin:-39px 0 0 -39px;border-radius:50%;
  display:grid;place-items:center;color:#fff;font-size:36px;font-weight:700;pointer-events:none;
  background:radial-gradient(circle at 35% 30%,#a3cbbd,#79ab9a);box-shadow:0 10px 28px rgba(80,130,110,.32);
  opacity:0;transform:scale(.62);transition:opacity .16s ease,transform .16s cubic-bezier(.2,1.3,.4,1)}
.burst.go{opacity:1;transform:scale(1)}
.toast{position:fixed;left:50%;top:calc(var(--barT) + env(safe-area-inset-top) + 10px);z-index:90;

  transform:translate(-50%,-8px);transition:opacity .16s ease,transform .16s ease}
.toast.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.toast span{min-width:0}
.toast button{flex:none;min-height:36px;padding:0 11px;border-radius:11px;border:0;background:var(--accent-soft);

<script>
(function(){
  'use strict';
  var N = 89;
  var BLANKS = JSON.parse(document.getElementById('blankData').textContent);
  var TOC = JSON.parse(document.getElementById('tocData').textContent);
  var TITLE = document.title;
  var DAY = 86400000;
  var IV = [0, 1, 2, 4, 7, 15, 30];   /* 等级 1..6 -> 下次复习间隔（天） */
  var body = document.body;
  var viewport = document.getElementById('viewport');
  var track = document.getElementById('track');
  var idxEl = document.getElementById('idx');
  var slider = document.getElementById('slider');
  var jump = document.getElementById('jump');
  var lvEl = document.getElementById('lv');
  var toastEl = document.getElementById('toast');
  var scrim = document.getElementById('sheetScrim');
  var sideEl = document.getElementById('side');
  var sideScrim = document.getElementById('sideScrim');
  var sideBody = document.getElementById('sideBody');

  /* ================= 存储（localStorage 全部 try/catch，隐私模式也不炸） ================= */
  var memStore = {};
  function lsGet(k){
    try { return window.localStorage.getItem(k); }
    catch (e) { return Object.prototype.hasOwnProperty.call(memStore, k) ? memStore[k] : null; }
  }
  function lsSet(k, v){
    try { window.localStorage.setItem(k, v); }
    catch (e) { memStore[k] = v; }
  }
  function lsDel(k){
    try { window.localStorage.removeItem(k); }
    catch (e) { delete memStore[k]; }
  }
  function readJSON(k, dft){
    try {
      var v = JSON.parse(lsGet(k) || 'null');
      return (v && typeof v === 'object') ? v : dft;
    } catch (e) { return dft; }
  }
  function fnv(s){
    var h = 0x811c9dc5;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = (h * 0x01000193) >>> 0; }
    return ('0000000' + h.toString(16)).slice(-8);
  }
  /* 用「书名 + 页数」生成稳定 key：同一本书重跑生成器（文件名换了）也接得上进度；
     前缀 dsh-r4- 与旧版 dsh-pv2-<文件名> 不冲突。 */
  var KEY = fnv(TITLE + '|' + N);
  var K_PREF = 'dsh-r4-prefs-' + KEY;
  var K_PROG = 'dsh-r4-progress-' + KEY;
  var PREF = readJSON(K_PREF, {});
  var PROG = readJSON(K_PROG, {});
  var HINTS = readJSON('dsh-r4-hints', {});   /* 一次性提示标记，全站只弹第一次 */
  if (!PROG.pages) PROG.pages = {};
  PROG.v = 4;
  function savePref(){ lsSet(K_PREF, JSON.stringify(PREF)); }
  function saveHints(){ lsSet('dsh-r4-hints', JSON.stringify(HINTS)); }
  function saveProg(){
    PROG.v = 4;
    PROG.title = TITLE;
    PROG.n = N;
    PROG.key = KEY;
    lsSet(K_PROG, JSON.stringify(PROG));
  }

  /* ================= 时间 / 遗忘曲线 ================= */
  function startOf(ts){
    var d = ts ? new Date(ts) : new Date();
    d.setHours(0, 0, 0, 0);
    return d.getTime();
  }
  function diffDays(ts){ return Math.round((startOf(ts) - startOf()) / DAY); }
  function fmtDate(ts){ var d = new Date(ts); return (d.getMonth() + 1) + '月' + d.getDate() + '日'; }
  function fmtWhen(ts){
    var d = diffDays(ts);
    if (d <= 0) return '今天';
    if (d === 1) return '明天';
    return d + ' 天后（' + fmtDate(ts) + '）';
  }
  function p2(n){ return n < 10 ? '0' + n : '' + n; }
  /* 每页都写一个本地时区的 ISO 日期 next，给首页 index.html 统计「今日待复习」用 */
  function isoOf(ts){ var d = new Date(ts); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
  function backfillNext(){
    var k, changed = false;
    for (k in PROG.pages) {
      if (!Object.prototype.hasOwnProperty.call(PROG.pages, k)) continue;
      var r = PROG.pages[k];
      if (r && r.lv > 0 && r.due && !r.next) { r.next = isoOf(r.due); changed = true; }
    }
    if (changed) saveProg();
  }
  function recOf(p){ return PROG.pages[p] || null; }
  function lvOf(p){ var r = PROG.pages[p]; return (r && r.lv) ? r.lv : 0; }
  function learnedCount(){
    var n = 0, k;
    for (k in PROG.pages) { if (PROG.pages[k] && PROG.pages[k].lv > 0) n++; }
    return n;
  }
  function masteredCount(){
    var n = 0, k;
    for (k in PROG.pages) { if (PROG.pages[k] && PROG.pages[k].lv >= 4) n++; }
    return n;
  }
  function dueList(){
    var out = [], te = startOf() + DAY - 1, k;
    for (k in PROG.pages) {
      if (!Object.prototype.hasOwnProperty.call(PROG.pages, k)) continue;
      var r = PROG.pages[k];
      if (r && r.lv > 0 && r.due && r.due <= te) out.push(parseInt(k, 10));
    }
    out.sort(function(a, b){ return (PROG.pages[a].due - PROG.pages[b].due) || (a - b); });
    return out;
  }

  /* ================= 主题 / 目录分组 ================= */
  var groups = [];
  (function buildGroups(){
    var last = null;
    TOC.forEach(function(it){
      if (it.g !== last) { groups.push({ g: it.g, pt: it.pt, start: it.p, end: it.p }); last = it.g; }
      groups[groups.length - 1].end = it.p;
    });
    for (var i = 0; i < groups.length; i++) {
      groups[i].start = groups[i].start;
      groups[i].end = (i + 1 < groups.length) ? (groups[i + 1].start - 1) : N;
      if (groups[i].end < groups[i].start) groups[i].end = groups[i].start;
    }
  })();
  function findGroup(name){
    for (var i = 0; i < groups.length; i++) if (groups[i].g === name) return groups[i];
    return null;
  }
  function groupOf(p){
    if (!groups.length) return { g: '全书', pt: '', start: 1, end: N };
    for (var i = 0; i < groups.length; i++) {
      if (p >= groups[i].start && p <= groups[i].end) return groups[i];
    }
    return p < groups[0].start ? groups[0] : groups[groups.length - 1];
  }
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ================= 页面骨架 ================= */
  /* URL 参数：?page=NN 指定页 / ?review=1 展开今日待复习 / ?random=1 随机抽一页
     参数优先于 localStorage 里保存的旧页码。 */
  var QS = {};
  try {
    var qs = (window.location.search || '').replace(/^\?/, '');
    qs.split('&').forEach(function(pair){
      if (!pair) return;
      var kv = pair.split('=');
      QS[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
    });
  } catch (e0) {}
  var qpage = parseInt(QS.page, 10);
  if (!(qpage >= 1 && qpage <= N)) qpage = 0;
  var cur = qpage || Math.min(N, Math.max(1, parseInt(PREF.p, 10) || 1));
  var clozeOn = !!PREF.c;
  var bstyle = PREF.s || 'candy';
  var collapsed = PREF.k || {};
  var tab = 'toc';
  var activeEl = null;

  function pad(n){ return (n < 100 ? (n < 10 ? '00' : '0') : '') + n; }
  function srcFor(i){ return 'pages-down/p' + pad(i) + '.webp'; }
  function thFor(i){ return 'thumbs-down/t' + pad(i) + '.webp'; }
  function ensure(i){
    if (i < 1 || i > N) return;
    var el = document.querySelector('#pb' + i + ' img');
    if (el && !el.getAttribute('src')) el.src = srcFor(i);
  }

  (function buildSlides(){
    var html = '';
    for (var i = 1; i <= N; i++) {
      html += '<div class="slide" id="sl' + i + '"><div class="pagebox" id="pb' + i + '">'
        + '<img data-i="' + i + '" alt="">'
        + '</div><span class="no">' + i + '</span></div>';
    }
    track.innerHTML = html;
  })();

  /* 挖空块：只给当前页前后各 1–2 页建 DOM（240 页 × 3567 个空全建会拖垮 iPad），
     已揭晓状态记在 openedKeys 里，翻回来还是揭晓过的样子 */
  var openedKeys = {};
  function blankKey(p, i){ return p + ':' + i; }
  function renderBlanks(k){
    var box = document.getElementById('pb' + k);
    if (!box || box.getAttribute('data-bb') === '1') return;
    box.setAttribute('data-bb', '1');
    var list = BLANKS[k];
    if (!list || !list.length) return;
    var frag = document.createDocumentFragment();
    for (var i = 0; i < list.length; i++) {
      var s = list[i], d = document.createElement('i');
      d.className = 'blank' + (openedKeys[blankKey(k, i)] ? ' open' : '');
      d.style.left = s.x + '%';
      d.style.top = s.y + '%';
      d.style.width = s.w + '%';
      d.style.height = s.h + '%';
      (function (el, kk, ii) {
        el.addEventListener('click', function (ev) {
          ev.stopPropagation();
          el.classList.add('open');
          openedKeys[blankKey(kk, ii)] = 1;
          updateCnt(kk);
        });
      })(d, k, i);
      frag.appendChild(d);
    }
    box.appendChild(frag);
  }
  function clearBlanksFar(center){
    var boxes = document.querySelectorAll('.pagebox[data-bb="1"]');
    for (var i = 0; i < boxes.length; i++) {
      var p = parseInt(boxes[i].id.replace('pb', ''), 10);
      if (Math.abs(p - center) > 3) {
        var olds = boxes[i].querySelectorAll('.blank');
        for (var j = 0; j < olds.length; j++) olds[j].parentNode.removeChild(olds[j]);
        boxes[i].removeAttribute('data-bb');
      }
    }
  }
  function syncBlanks(center){
    renderBlanks(center - 1); renderBlanks(center); renderBlanks(center + 1); renderBlanks(center + 2);
    clearBlanksFar(center);
  }
  function updateCnt(k){
    if (parseInt(k, 10) === cur) refreshCurCnt();
  }
  function refreshCurCnt(){
    var el = document.getElementById('cntCur');
    if (!el) return;
    var list = BLANKS[cur] || [];
    var all = list.length;
    if (!all) { el.textContent = ''; return; }
    renderBlanks(cur);
    var box = document.getElementById('pb' + cur);
    var open = box ? box.querySelectorAll('.blank.open').length : 0;
    el.textContent = (all - open) + ' 空';
  }

  /* ================= 顶栏 / 底栏状态 ================= */
  function refreshBadge(){
    var d = dueList();
    var nEl = document.getElementById('todayN');
    if (nEl) nEl.textContent = d.length;
    var b = document.getElementById('btnToday');
    if (b) b.classList.toggle('hot', d.length > 0);
    var st = document.getElementById('sideStat');
    if (st) st.textContent = '已背 ' + learnedCount() + ' / ' + N + ' 页';
  }
  function refreshDots(){
    var els = document.querySelectorAll('[data-dp]');
    for (var i = 0; i < els.length; i++) {
      var p = parseInt(els[i].getAttribute('data-dp'), 10);

  var randMode = null;

    updateRandUI();
    var names = { all: '全部', sec: '当前部分', new: '没背过的' };
    toast('抽查 · 第 ' + p + ' 页（' + names[mode] + '）· 背完点右下角 ✓');
  }
  function updateRandUI(){
    document.getElementById('btnRand').classList.toggle('on', !!randMode);
    document.getElementById('btnAgain').style.display = randMode ? '' : 'none';
    jump.style.display = randMode ? 'none' : '';
  }
  function exitRandom(){
    randMode = null;
    updateRandUI();
    toast('已退出抽查');
  }
  function renderRand(){
    var gr = groupOf(cur);
    document.getElementById('randAll').innerHTML = '全部 <span>' + N + ' 页</span>';
    document.getElementById('randSec').innerHTML = (gr ? esc(gr.g) : '当前部分') + ' <span>' + (gr ? (gr.end - gr.start + 1) : N) + ' 页</span>';
    document.getElementById('randNew').innerHTML = '只抽没背过的 <span>' + (N - learnedCount()) + ' 页</span>';
  }
  document.getElementById('btnRand').addEventListener('click', function(){
    if (randMode) { exitRandom(); return; }
    openSheet('randSheet');
  });
  document.getElementById('randSheet').addEventListener('click', function(e){
    var o = e.target.closest('[data-m]');
    if (o) doRandom(o.getAttribute('data-m'));
  });
  document.getElementById('btnAgain').addEventListener('click', function(){ doRandom(randMode || 'all'); });

  /* ================= 挖空 ================= */
  function setStyle(st){
    bstyle = st;
    body.className = body.className.replace(/bs-\w+/g, '').replace(/\s+/g, ' ').trim();
    body.classList.add('bs-' + st);
    body.classList.toggle('cloze', clozeOn);
    var bs = document.querySelectorAll('#styleSeg button');
    for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('on', bs[i].getAttribute('data-s') === st);
    savePref();
  }
  function setCloze(on, silent){
    clozeOn = on;
    body.classList.toggle('cloze', on);
    document.getElementById('btnCloze').classList.toggle('on', on);
    var cs = document.querySelectorAll('#clozeSeg button');
    for (var i = 0; i < cs.length; i++) {
      var c = cs[i].getAttribute('data-c');
      cs[i].classList.toggle('on', (c === 'on' && on) || (c === 'off' && !on));
    }
    if (on) for (var k = 1; k <= N; k++) updateCnt(k);
    savePref();
    if (on && !silent) toast('已挖空 · 点色块显示答案');
  }
  function clearOpened(){
    openedKeys = {};
    var els = document.querySelectorAll('.blank.open');
    for (var i = 0; i < els.length; i++) els[i].classList.remove('open');
    refreshCurCnt();
  }
  function revealAll(){
    var n = 0;
    Object.keys(BLANKS).forEach(function (k) {
      var list = BLANKS[k] || [];
      for (var i = 0; i < list.length; i++) {
        if (!openedKeys[blankKey(k, i)]) { n++; openedKeys[blankKey(k, i)] = 1; }
      }
    });
    var els = document.querySelectorAll('.blank');
    for (var i = 0; i < els.length; i++) els[i].classList.add('open');
    refreshCurCnt();
    toast('已显示 ' + n + ' 个空');
  }
  document.getElementById('btnCloze').addEventListener('click', function(){
    if (!clozeOn) { setCloze(true); return; }
    if (openSheetId === 'clozeSheet') closeSheets(); else openSheet('clozeSheet');
  });
  document.getElementById('clozeSheet').addEventListener('click', function(e){
    var st = e.target.closest('#styleSeg button');
    if (st) return setStyle(st.getAttribute('data-s'));
    var c = e.target.closest('#clozeSeg button');
    if (c) {
      var m = c.getAttribute('data-c');
      if (m === 'on') { setCloze(true); clearOpened(); toast('已重新挖空'); }
      else if (m === 'off') setCloze(false);
      else revealAll();
      return;
    }
    if (e.target.closest('#btnDone')) closeSheets();
  });

  /* ================= 底部弹层 ================= */
  var openSheetId = null;
  function openSheet(id){
    if (openSheetId && openSheetId !== id) {
      var prev = document.getElementById(openSheetId);
      if (prev) prev.classList.remove('show');
    }
    var el = document.getElementById(id);
    if (!el) return;
    if (id === 'todaySheet') renderToday();
    if (id === 'randSheet') renderRand();
    if (id === 'setSheet') renderSet();
    el.classList.add('show');
    scrim.classList.add('show');
    openSheetId = id;
  }
  function closeSheets(){
    if (openSheetId) {
      var el = document.getElementById(openSheetId);
      if (el) el.classList.remove('show');
    }
    openSheetId = null;
    scrim.classList.remove('show');
  }
  scrim.addEventListener('click', closeSheets);
  document.addEventListener('click', function(e){
    if (e.target.closest && e.target.closest('[data-close]')) closeSheets();
  });
  document.getElementById('btnMore').addEventListener('click', function(){ openSheet('setSheet'); });

  /* ================= 记录导出 / 清空 ================= */
  function renderSet(){
    var learned = learnedCount(), mastered = masteredCount(), due = dueList().length;
    document.getElementById('setStat').innerHTML =
      '<div><b>' + learned + '</b><span>已背页数</span></div>' +
      '<div><b>' + mastered + '</b><span>已熟页数</span></div>' +
      '<div><b>' + due + '</b><span>今日待复习</span></div>';
    document.getElementById('exportBox').value = JSON.stringify({
      v: 4,
      title: TITLE,
      n: N,
      exportedAt: new Date().toISOString(),
      key: KEY,
      pages: PROG.pages
    });
  }
  document.getElementById('btnCopy').addEventListener('click', function(){
    var ta = document.getElementById('exportBox');
    ta.focus();
    ta.select();
    var done = function(ok){ toast(ok ? '记录已复制到剪贴板' : '已选中文本，长按「复制」即可'); };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ta.value).then(function(){ done(true); }, function(){ done(false); });
        return;
      }
    } catch (e) {}
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
    done(ok);
  });
  document.getElementById('btnDl').addEventListener('click', function(){
    try {
      var txt = document.getElementById('exportBox').value;
      var blob = new Blob([txt], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'dsh-背诵记录-' + (N) + '页-' + isoOf(Date.now()) + '.json';
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){ try { document.body.removeChild(a); URL.revokeObjectURL(url); } catch (e) {} }, 500);
      toast('已生成 JSON 文件（在「文件」App 里可找到）');
    } catch (e) {
      toast('浏览器不支持下载，请用「复制记录」');
    }
  });
  var resetArmed = false, resetTimer = null;
  document.getElementById('btnReset').addEventListener('click', function(){
    var b = this;
    if (!resetArmed) {
      resetArmed = true;
      b.classList.add('arm');
      b.textContent = '再点一次 = 清空';
      clearTimeout(resetTimer);
      resetTimer = setTimeout(function(){
        resetArmed = false; b.classList.remove('arm'); b.textContent = '清空记录';
      }, 3600);
      return;
    }
    resetArmed = false;
    clearTimeout(resetTimer);
    b.classList.remove('arm');
    b.textContent = '清空记录';
    PROG = { v: 4, pages: {} };
    saveProg();
    document.getElementById('exportBox').value = '';
    afterChange();
    renderSet();
    toast('背诵记录已清空，可以重新开始');
  });

  /* ================= 提示条 ================= */
  var toastTimer = null;
  function hideToast(){ toastEl.classList.remove('show'); }
  function toast(msg, opt){
    opt = opt || {};
    toastEl.innerHTML = '';
    var s = document.createElement('span');
    s.textContent = msg;
    toastEl.appendChild(s);
    if (opt.label) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = opt.label;
      b.addEventListener('click', function(){
        hideToast();
        try { if (opt.fn) opt.fn(); } catch (e) {}
      });
      toastEl.appendChild(b);
    }
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, opt.dur || (opt.label ? 4500 : 1900));
  }
  function burst(){
    var el = document.getElementById('burst');
    var r = viewport.getBoundingClientRect();
    el.style.left = (r.left + r.width / 2) + 'px';
    el.style.top = (r.top + r.height / 2) + 'px';
    el.classList.add('go');
    clearTimeout(burst._t);
    burst._t = setTimeout(function(){ el.classList.remove('go'); }, 560);
  }

  /* ================= 键盘 ================= */
  document.addEventListener('keydown', function(e){
    var tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') {
      if (e.key === 'Escape') document.activeElement.blur();
      return;
    }
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); goTo(cur + 1, true); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); goTo(cur - 1, true); }
    else if (e.key === 'Escape') { if (zoom.on) resetZoom(true); else { closeSheets(); closeSide(); } }
    else if (e.key === '+' || e.key === '=') { e.preventDefault(); toggleZoom(); }
    else if (e.key === '-') { e.preventDefault(); resetZoom(true); }
  });

  /* ================= 启动 ================= */
  body.classList.remove('side-off');   /* 横屏默认常驻目录，不受旧状态影响 */
  renderToc();
  setStyle(bstyle);
  if (clozeOn) setCloze(true, true);
  updateRandUI();
  fit();
  ensure(cur); ensure(cur + 1);
  setCur(cur);
  refreshBadge();
  refreshDots();
  backfillNext();
  saveProg();
  setTimeout(function(){ goTo(cur, false); }, 70);
  if (QS.random === '1') {
    setTimeout(function(){ doRandom('all'); }, 420);
  } else if (QS.review === '1') {
    setTimeout(function(){ openSheet('todaySheet'); }, 420);
  }
  if (!HINTS.h1) {
    HINTS.h1 = 1;
    saveHints();
    setTimeout(function(){ toast('双击书页放大 · 右下角「背完了」记进度', { dur: 2600 }); }, 600);
  }
})();
</script>
